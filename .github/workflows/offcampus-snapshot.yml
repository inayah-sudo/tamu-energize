# Pulls off-campus energy drink prices and store hours from Snowflake into offcampus.js.
# Setup: README.md -> "Off-campus prices (Snowflake)".
name: Off-campus price snapshot

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write   # commit the new offcampus.js
  pages: write      # ask GitHub Pages to rebuild after that commit

concurrency:
  group: offcampus-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Snowflake connector
        run: pip install "snowflake-connector-python>=3.12" cryptography

      - name: Run the Snowflake procedures
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          PRICES_PROCEDURE: ${{ vars.PRICES_PROCEDURE }}
          HOURS_PROCEDURE: ${{ vars.HOURS_PROCEDURE }}
        run: python scripts/snapshot_offcampus.py

      - name: Update the published dataset files
        run: node scripts/export_dataset.js

      - name: Commit the snapshot if it changed
        id: commit
        run: |
          if git diff --quiet -- offcampus.js scripts/store_coords.json data && [ -z "$(git ls-files --others --exclude-standard scripts/store_coords.json)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offcampus.js data scripts/store_coords.json 2>/dev/null || git add offcampus.js data
          git commit -m "Update off-campus price snapshot"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick up the change on its next build."
